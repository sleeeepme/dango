<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#afcfb7">
<meta name="description" content="ダンゴムシと、ひろい地下をころころ探検。光るキノコをたよりに、次の降り口を見つけよう。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2212%22%20fill%3D%22%23e6efcf%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2222%22%20r%3D%2214%22%20fill%3D%22%2394b6dd%22%20stroke%3D%22%235a7b9f%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M10%2019q10%207%2020%200M9%2025q11%207%2022%200M15%2010q-4-8-8-3M25%2010q4-8%208-3%22%20fill%3D%22none%22%20stroke%3D%22%236d8aac%22%2F%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2218%22%20r%3D%224%22%20fill%3D%22%23fffaf0%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2218%22%20r%3D%224%22%20fill%3D%22%23fffaf0%22%2F%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2218%22%20r%3D%222%22%20fill%3D%22%23405976%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2218%22%20r%3D%222%22%20fill%3D%22%23405976%22%2F%3E%3Cpath%20d%3D%22M18%2023q2%203%204%200%22%20fill%3D%22none%22%20stroke%3D%22%23405976%22%2F%3E%3C%2Fsvg%3E">
<title>ダンゴムシころころ</title>
<style>
:root{color-scheme:light;background:#afcfb7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#boost{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:76px;height:74px;display:grid;place-items:center;overflow:hidden;touch-action:none;cursor:pointer;border:2px solid #fff8d9;border-radius:25px;color:#9e7542;background:#fff0cce8;box-shadow:0 5px 0 #c1a56a,0 8px 13px #5d826320}
#boost:before{content:"";position:absolute;bottom:0;left:0;width:100%;height:var(--charge,0%);background:linear-gradient(#ffda8455,#f0c46c99)}
#boost svg{position:relative;width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#boost:disabled{cursor:default}
#boost:not(:disabled){border-color:#fff8d1;color:#88622c;background:#ffe9a3;box-shadow:0 5px 0 #c1a56a,0 0 22px #fff2b577}
#boost:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #c1a56a}
#boost:focus-visible{outline:3px solid #6b8cb4;outline-offset:4px}
@media(min-width:700px){#boost{right:28px;bottom:calc(28px + env(safe-area-inset-bottom))}}
@media(max-height:500px){#boost{bottom:calc(12px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="game" aria-label="ダンゴムシの地下探検。左右へドラッグして移動、素早く上へ払ってジャンプ。"></canvas>
<button id="boost" aria-label="ぐるぐる充電中" disabled>
  <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 8a10 10 0 1 0 2 9M21 3v6h-6M17 11l-5 5h5l-5 5"/></svg>
</button>
<script src="game.js"></script>
</body>
</html>
