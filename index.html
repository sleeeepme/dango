<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#233a35">
<meta name="description" content="ダンゴムシと、ひろい地下をころころ探検。光るキノコをたよりに、次の降り口を見つけよう。">
<title>ダンゴムシころころ</title>
<style>
:root{color-scheme:dark;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#f0ecd3;background:#233a35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;inset:calc(16px + env(safe-area-inset-top)) 18px auto;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:9px;letter-spacing:.22em;color:#bacbad;margin:0 0 5px}
h1{font-size:16px;font-weight:700;letter-spacing:.04em;margin:0;text-shadow:0 2px 8px #163126}
#biome{font-size:10px;color:#b8c6ab;margin-top:6px;display:flex;align-items:center;gap:6px}
#biome:before{content:"";width:5px;height:5px;border-radius:50%;background:#bcd295;box-shadow:0 0 9px #bcd29566}
.stats{display:flex;gap:7px}
.stat{min-width:54px;border:1px solid #c3d2b52b;border-radius:14px;background:#152d29a8;padding:9px 11px;text-align:center;backdrop-filter:blur(8px)}
.stat-label{font-size:8px;letter-spacing:.1em;color:#b4c4ae;display:block;margin-bottom:4px}
.stat-value{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#exploration{position:fixed;top:calc(94px + env(safe-area-inset-top));left:18px;pointer-events:none;display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.08em;color:#b0c3ab}
#map-track{position:relative;width:95px;height:3px;border-radius:3px;background:#a4b79c30}
#map-track:before{content:"";position:absolute;left:var(--from,0%);width:var(--span,0%);height:3px;background:#a4bc8977;border-radius:3px}
#map-track:after{content:"";position:absolute;left:var(--player,50%);top:-2px;width:7px;height:7px;background:#e2e9bc;border-radius:50%;box-shadow:0 0 8px #d2e3a866;transform:translateX(-50%)}
#tip{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;font-size:10px;letter-spacing:.03em;color:#d3ddbf;text-shadow:0 2px 5px #142822;pointer-events:none}
#controls{position:fixed;inset:auto 18px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:18px}
.movement{display:flex;gap:13px}
button{touch-action:none;border:1px solid #d4dfbd66;color:#f1f0d5;cursor:pointer;background:linear-gradient(145deg,#536955e8,#283f36ed);box-shadow:0 5px 0 #142b25,0 8px 18px #11271e40,inset 0 1px 0 #ffffff18;display:grid;place-items:center;width:64px;height:64px;border-radius:22px;font:inherit}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #142b25;background:#637a5b}
button:focus-visible{outline:3px solid #f0dea0;outline-offset:4px}
button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#boost{position:relative;overflow:hidden;width:76px;height:70px;border-radius:25px;border-color:#d6c38b7a;color:#f7e5aa;background:#463e2cec;gap:0;align-content:center}
#boost:before{content:"";position:absolute;bottom:0;left:0;width:100%;height:var(--charge,0%);background:linear-gradient(#a99a5860,#ad9b5066);z-index:0}
#boost>*{position:relative}
#boost svg{width:26px;height:26px;margin-bottom:2px}
#energy{font-size:10px;font-weight:600}
#boost:disabled{cursor:default;transform:none}
#boost:not(:disabled){border-color:#f0d99a;box-shadow:0 5px 0 #3d3522,0 0 22px #e1c97a33}
@media(min-width:700px){#hud{inset:24px 28px auto}h1{font-size:20px}.eyebrow{font-size:10px}#exploration{top:110px;left:28px}#controls{left:28px;right:28px;bottom:28px}#tip{font-size:12px;bottom:118px}.stat{min-width:72px}#biome{font-size:11px}}
@media(max-height:500px){#hud{top:calc(10px + env(safe-area-inset-top))}.eyebrow,#biome,#exploration{display:none}#tip{bottom:96px}#controls{bottom:calc(12px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="game" aria-label="ダンゴムシの地下探検。左右へドラッグして移動、素早く上へ払ってジャンプ。"></canvas>
<header id="hud">
  <div><p class="eyebrow">ちいさな、地底の冒険</p><h1>ダンゴムシころころ</h1><div id="biome">苔むす入口</div></div>
  <div class="stats">
    <div class="stat"><span class="stat-label">ふかさ</span><span class="stat-value" id="depth">0 m</span></div>
    <div class="stat"><span class="stat-label">たからもの</span><span class="stat-value" id="score">0</span></div>
  </div>
</header>
<div id="exploration"><span>←</span><div id="map-track" aria-hidden="true"></div><span>→</span><span>ひろい地下を探検</span></div>
<div id="tip">左右にひっぱって探検。上にサッと払うとジャンプ。</div>
<nav id="controls" aria-label="ゲーム操作">
  <div class="movement">
    <button id="left" aria-label="左へころがる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h13"/></svg></button>
    <button id="right" aria-label="右へころがる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7M17 12H4"/></svg></button>
  </div>
  <button id="boost" aria-label="ぐるぐる充電 0%" disabled><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 8a10 10 0 1 0 2 9M21 3v6h-6M17 11l-5 5h5l-5 5"/></svg><span id="energy">0%</span></button>
</nav>
<script src="game.js"></script>
</body>
</html>
