<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ダンゴムシころころ</title><style>body{margin:0;background:#765a40;overflow:hidden;touch-action:none;font-family:system-ui}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;color:white;background:#30231cb8;border-radius:15px;padding:10px;font-weight:bold;font-size:14px}#tip{position:fixed;top:65px;left:12px;color:#fff4c9;font-size:13px}#controls{position:fixed;bottom:20px;left:12px;right:12px;display:flex;justify-content:space-between}button{height:64px;min-width:68px;border:2px solid #fff;border-radius:20px;background:#f3d18d;font-size:22px;touch-action:none}#boost{font-size:14px}</style><canvas id="game"></canvas><div id="hud">🪲 ダンゴムシころころ</div><div id="tip">ゆっくりドラッグ / 素早く上へ払うとジャンプ！</div><div id="controls"><button id="left">◀</button><button id="right">▶</button><button id="boost">⚡ぐるぐる</button></div><script src="game.js"></script></html>
